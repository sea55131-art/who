<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김해의 생태계를 지켜라!</title>
    <style>
        :root { --main-blue: #0075c4b2; --main-green: #2ecc71; --main-red: #e74c3c; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f7ff; text-align: center; margin: 0; padding: 20px; }
        #game-container { width: 95%; max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); box-sizing: border-box; }
        .hidden { display: none; }
        input { padding: 12px; width: 80%; margin: 10px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; }
        .img-wrapper { width: 100%; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 15px; margin: 20px 0; border: 5px solid #f8f9fa; background: #eee; display: flex; align-items: center; justify-content: center; }
        .organism-img { width: 100%; height: 100%; object-fit: contain; background-color: #f8f9fa; }
        .btn { padding: 15px 25px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; border-radius: 12px; transition: 0.2s; margin: 5px; }
        .btn-start { background: var(--main-blue); color: white; width: 100%; }
        .btn-native { background: var(--main-green); color: white; flex: 1; }
        .btn-invasive { background: var(--main-red); color: white; flex: 1; }
        .btn-group { display: flex; gap: 10px; }
        .hp-bar-bg { width: 100%; height: 20px; background: #eee; border-radius: 10px; margin: 15px 0; overflow: hidden; position: relative; }
        #hp-fill { width: 100%; height: 100%; background: var(--main-red); transition: 0.4s; }
        .rank-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .rank-table th, .rank-table td { padding: 10px; border-bottom: 1px solid #eee; }
        .rank-table th { background: #f8f9fa; }
        #study-list { max-height: 300px; overflow-y: auto; text-align: left; background: #fdfdfd; padding: 10px; border-radius: 10px; border: 1px solid #eee; margin-bottom: 20px; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>김해의 생태계를 지켜라!</h1>

    <div id="screen-login">
        <h3>학번과 이름을 입력하세요!</h3>
        <h5>토종과 외래종을 구분하여 문제를 맞추세요!<br>1등에겐 소정의 상품이 있습니다!</h5>
        <input type="text" id="user-student-id" placeholder="학번">
        <input type="text" id="user-name" placeholder="이름">
        <hr>
        <p>생물들을 미리 학습하세요!</p>
        <div id="study-list"></div>
        <button class="btn btn-start" onclick="checkLogin()">학습 완료! 게임 시작</button>
        <h6>사진 출처 : 나무위키</h6>
    </div>

    <div id="screen-game" class="hidden">
        <div class="hp-bar-bg"><div id="hp-fill"></div></div>
        <div id="status-info" style="display: flex; justify-content: space-between; font-size: 14px; font-weight: bold;">
            <span id="player-display"></span>
            <span id="question-count"></span>
        </div>
        <div class="img-wrapper">
            <img id="target-img" class="organism-img" src="">
        </div>
        <h2 id="target-title">이 생물은 토종일까요? 외래종일까요?</h2>
        <div class="btn-group">
            <button class="btn btn-native" onclick="checkAnswer(true)">토종</button>
            <button class="btn btn-invasive" onclick="checkAnswer(false)">외래종</button>
        </div>
        <p id="feedback" style="font-weight: bold; font-size: 1.2em; height: 30px;"></p>
    </div>

    <div id="screen-result" class="hidden">
        <h2 id="result-text"></h2>
        <h3 id="final-score"></h3>
        <hr>
        <h4>🏆 명예의 전당 (TOP 10)</h4>
        <table class="rank-table">
            <thead>
                <tr><th>순위</th><th>학번</th><th>이름</th><th>점수</th></tr>
            </thead>
            <tbody id="rank-body"></tbody>
        </table>
        <button class="btn btn-start" onclick="location.reload()">다시 하기</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // 1. 파이어베이스 설정
    const firebaseConfig = {
        apiKey: "AIzaSyAsWTxiAx8Ei15W9hxpZ6-dJms_kNGQJ_k",
        authDomain: "whois-19102.firebaseapp.com",
        databaseURL: "https://whois-19102-default-rtdb.firebaseio.com",
        projectId: "whois-19102",
        storageBucket: "whois-19102.firebasestorage.app",
        messagingSenderId: "820657052484",
        appId: "1:820657052484:web:b173eda21a95fe1edbd511",
        measurementId: "G-NJXL1YC41X"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    // 2. 생물 데이터
    const data = [
        { name: "각시붕어", type: "native", info: "몸에서 무지개 빛이 나는 물속의 보석.", img: "https://i.namu.wiki/i/z3rPsftpMlmiFBgJZwylIGS3QdjcFN1HSWoZWu-y22FdchTQP3C7IVKPiEmc9KhsmsG8xTeosoj8PRuwuuRVqO88K1vrO321sgY2kwFG3imf81Wfo6_mtke4ayhEXXhXF-LrpQc133w9cSlGd1Md6w.webp" },
        { name: "큰입배스", type: "invasive", info: "입이 아주 크고 토종 물고기를 싹쓸이함.", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCFvGieUvpaRxHRyjOcTvSG4CeBKu_vZIb_w&s" },
        { name: "수달", type: "native", info: "천연기념물이자 맑은 물의 상징.", img: "https://i.namu.wiki/i/lu_Kfr1AnBkkKcKrZxduYz0q57TlpWLtOjTQEVsGxUVWDE-ss7ZOHLKtcXZsZx0FnrlQyicyASarJuV1KPfqB5S1yDp8Ii3C0xO5iWW3zwveeDfkVXVESu_eoUOvp2LBYSch2qP-1M9vaBibmXpldQ.webp" },
        { name: "뉴트리아", type: "invasive", info: "거대한 쥐처럼 생겼고 습지를 파괴함.", img: "https://i.namu.wiki/i/1imihPNg9tL086klyX1DGY77indeI6NYvRlamsjr4T5izkcMrCJZM-TD04zRDbAl8wj8VgBbDesPx81v2WdoPD21sJVmjKfN-nCvu8_gu4jHC2qou06FszPpEoefVAgHH8YdAOzPL6-7d7RciYsmvQ.webp" },
        { name: "남생이", type: "native", info: "얼굴에 노란 줄무늬가 있는 토종 거북.", img: "https://i.namu.wiki/i/68xOTWCbbqmjG0inspKWJvdc8RSoGbp1w911nxq-n32tINxqWD1IfZCO4ujlsarGUPJzhHP-StwIUB90w1ByyuycYryx97ecWB6TMkFIfjWnS-UmvVzibs-b7uZnusm4kLCNhHWaKTrLkd38t2uVRA.jpg" },
        { name: "붉은귀거북", type: "invasive", info: "눈 옆에 빨간 줄무늬가 있는 외래종 거북.", img: "https://i.namu.wiki/i/2liVMhMFs8Ut-tS8UyMzgIUnIihRJ1mo2JN_RO8J9PY9pbc7pqG-UveQs_VvVqY_Nb4qM92ovuN2tG8bFnjDj7mZZRbck-lljN-o1M-cAZi3Cbxzfma0Gr1KQn5JwRy7E-QfO8Py0jSMXW_n20FPaA.webp" },
        { name: "잉어", type: "native", info: "온몸이 비늘로 덮여 있는 토종 물고기.", img: "https://i.namu.wiki/i/1_AcBT3y5fWvDkBED8t0-3gOMX2qK3cAarsTJH5MIv1m0_mLUMdie40PcBd2gRPMpYCl1fj8nyf13iosaJqNY9nt263yue_xqnrfSK0K_tKeVideBf_SwfQmfgmvskLDLhZBpG1S7UJJ_l7AsRKLGQ.webp" },
        { name: "향어", type: "invasive", info: "비늘이 거의 없고 매끈한 외래종 잉어.", img: "https://i.namu.wiki/i/zXU5KBz7I0XYerJWsxcNdk3Few2zm4aTHhfvJeVjcrgxYyvmA7zJg24yese531IHHVsPilrUWiFeEOu9VwO9DgtC8Vz3nbOCjMdzOQoQHjJl2z42GqvBP7Y8dAgKHI_sXIUypK1DGhfj8YMP1_PHtQ.webp" },
        { name: "가시상추", type: "invasive", info: "잎맥에 가시가 돋아 있는 생태계 교란종.", img: "https://i.namu.wiki/i/XJLZPkoCLN84SQHCXztmMqY6xIPbshGO9KHoezz0jHOYqjgqhBE75a7Nx-VCSlPzwX6ysppYgvs-e5ARfuMpeUwjI1tj84HezRY_8vY0XOA-L8fZF2z50jMHDv23-5ZGWNSKVW1-sqEo_ni-XfgfqA.webp" },
        { name: "가시박", type: "invasive", info: "다른 식물을 감아 죽이는 무서운 덩굴.", img: "https://i.namu.wiki/i/bb2RyX3xed-35T9APcJz1n2vVjb0yQFOxIqCuvSQO0MJ2s0vckof-IFiDFnuSNnb2bIaTmUU_RsooO_ZLtSgcBR3j9CFgiv2BPnkwKP3BC5H_f3kKRuxHOzHwuceC4ePr9uQGHiLvg0BzMqWLi26MA.webp" }
    ];

    let gameList = [];
    let currentIdx = 0;
    let score = 0;
    let hp = 100;
    let playerInfo = { id: "", name: "" };

    // 초기화: 학습 리스트 생성
    function init() {
        const studyDiv = document.getElementById('study-list');
        studyDiv.innerHTML = "";
        data.forEach(item => {
            studyDiv.innerHTML += `
                <div style="display:flex; align-items:center; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:5px;">
                    <img src="${item.img}" style="width:50px; height:50px; object-fit:cover; border-radius:5px; margin-right:10px;">
                    <div style="font-size:13px;">
                        <b style="color:${item.type==='native'?'green':'red'}">[${item.type==='native'?'토종':'외래종'}] ${item.name}</b><br>
                        ${item.info}
                    </div>
                </div>`;
        });
    }

    function checkLogin() {
        const id = document.getElementById('user-student-id').value;
        const name = document.getElementById('user-name').value;
        if(!id || !name) return alert("학번과 이름을 입력해주세요!");
        playerInfo = { id, name };
        startGame();
    }

    function startGame() {
        gameList = [...data].sort(() => Math.random() - 0.5).slice(0, 5);
        currentIdx = 0; score = 0; hp = 100;
        document.getElementById('screen-login').classList.add('hidden');
        document.getElementById('screen-game').classList.remove('hidden');
        document.getElementById('player-display').innerText = `수호자: ${playerInfo.name}(${playerInfo.id})`;
        updateUI();
        showQuestion();
    }

    function showQuestion() {
        if(currentIdx >= gameList.length || hp <= 0) return endGame();
        const item = gameList[currentIdx];
        document.getElementById('target-img').src = item.img;
        document.getElementById('question-count').innerText = `${currentIdx + 1} / ${gameList.length}`;
        document.getElementById('feedback').innerText = "";
    }

    function checkAnswer(isNative) {
        const item = gameList[currentIdx];
        const correct = (item.type === 'native') === isNative;
        if(correct) {
            score += 20;
            document.getElementById('feedback').innerText = "✅ 정답!";
            document.getElementById('feedback').style.color = "green";
        } else {
            hp -= 25;
            document.getElementById('feedback').innerText = "❌ 공격받음!";
            document.getElementById('feedback').style.color = "red";
            updateUI();
        }
        currentIdx++;
        setTimeout(showQuestion, 1000);
    }

    function updateUI() {
        document.getElementById('hp-fill').style.width = hp + "%";
    }

    function endGame() {
        document.getElementById('screen-game').classList.add('hidden');
        document.getElementById('screen-result').classList.remove('hidden');
        document.getElementById('result-text').innerText = hp > 0 ? "🏆 성공!" : "💀 생태계 위기!";
        document.getElementById('final-score').innerText = `최종 점수: ${score}점`;
        saveRank();
    }

    function saveRank() {
        const playerPath = 'ranks/' + playerInfo.id;
        database.ref(playerPath).once('value').then((snapshot) => {
            if (snapshot.exists()) {
                alert("이미 참여한 기록이 있습니다. 최초 점수만 유지됩니다.");
                displayRank();
            } else {
                database.ref(playerPath).set({
                    id: playerInfo.id,
                    name: playerInfo.name,
                    score: score,
                    timestamp: Date.now()
                }).then(() => {
                    displayRank();
                });
            }
        });
    }

    function displayRank() {
        const tbody = document.getElementById('rank-body');
        database.ref('ranks').orderByChild('score').limitToLast(10).once('value').then((snapshot) => {
            let rankList = [];
            snapshot.forEach((child) => { rankList.push(child.val()); });
            rankList.sort((a, b) => b.score - a.score);
            tbody.innerHTML = rankList.map((r, i) => `
                <tr><td>${i + 1}위</td><td>${r.id}</td><td>${r.name}</td><td>${r.score}점</td></tr>
            `).join('');
        });
    }

    // 문서가 로드된 후 실행
    window.onload = init;
</script>
</body>
</html>
